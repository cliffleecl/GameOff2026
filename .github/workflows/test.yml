# 每次 push 和 PR 都在 GitHub 的機器上跑測試（public repo 免費），不吃本機電腦。
# 結果：Actions 頁面的每次執行 → Summary 有模擬數據；Artifacts 可以下載 E2E 報告（含截圖）。
name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: 單元測試＋模擬
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: 模擬玩家（用道具 vs 不用道具）
        run: |
          {
            echo '## 模擬玩家 50 局'
            echo '```'
            npm run --silent sim -- --runs 50
            echo
            npm run --silent sim -- --runs 50 --nobuild
            echo '```'
            echo '模擬玩家很笨，數字只能做前後比較。'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if grep -q '⚠' "$GITHUB_STEP_SUMMARY"; then echo '::error::有局超過 900 秒沒結束（可能卡死）'; exit 1; fi

  e2e:
    name: E2E（電腦＋手機橫向）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: test-results/
          retention-days: 14

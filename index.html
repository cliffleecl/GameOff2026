<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Brain Shift</title>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="fog"></div>
  <div id="flash"></div>
  <!-- 跟著角色的血條＋材料條（材料一格＝一個道具） -->
  <div id="pbar"><div class="hp"><div id="pfill"></div></div><div class="mat"><div id="mfill"></div><div id="mseg"></div></div></div>

  <!-- 遊戲中 HUD：零件、時間、屍腦，置中、只用圖示 -->
  <header id="hud">
    <div class="pill" id="sParts"></div>
    <div class="pill" id="sTime"><i class="ico" data-icon="clock"></i><b id="vTime">0:00</b></div>
    <div class="pill" id="brainStat"><i class="ico" data-icon="brain"></i><div id="brainBar"><div id="brainFill"></div></div></div>
  </header>
  <div id="ticker" class="fade"></div>
  <div id="report" class="hide"><h2 id="rTitle"></h2><ul id="rBody"></ul></div>
  <div id="evac"></div>
  <canvas id="minimap"></canvas>
  <div class="arrow" id="arPart"></div>
  <div class="arrow radio" id="arRadio"></div>

  <footer id="bar">
    <div class="row builds" id="builds">
      <button class="bld" data-b="obstacle"><i class="ico" data-icon="obstacle"></i><span data-i18n="item.obstacle"></span><kbd>1</kbd></button>
      <button class="bld" data-b="trap"><i class="ico" data-icon="trap"></i><span data-i18n="item.trap"></span><kbd>2</kbd></button>
      <button class="bld" data-b="bait"><i class="ico" data-icon="bait"></i><span data-i18n="item.bait"></span><kbd>3</kbd></button>
    </div>
  </footer>

  <div id="stick"><div id="knob"></div></div>
  <div id="rotate"><div><span class="ph">📱</span><br><span data-i18n="rotate"></span></div></div>

  <!-- 標題畫面：全螢幕，背景是即時的 3D 場景 -->
  <section id="title" class="screen">
    <div class="tbg"></div>
    <div class="tmain">
      <div class="logo" aria-label="Brain Shift">
        <span class="l1" data-text="BRAIN">BRAIN</span>
        <span class="l2" data-text="SHIFT">SHIFT</span>
      </div>
      <p class="tag" data-i18n="title.tag"></p>
      <nav class="tmenu">
        <button id="btnStart" class="primary" data-i18n="btn.start"></button>
        <button id="btnHow" data-i18n="btn.howto"></button>
        <button id="btnLang"></button>
      </nav>
    </div>
    <div class="tfoot">GitHub Game Off 2026 · Theme: Shift</div>
  </section>

  <!-- 如何遊玩：全畫面，一頁一個段落（圖＋短文字），上方分頁、下方上一頁／下一頁 -->
  <section id="howto" class="screen hide">
    <header class="hw-top">
      <button id="btnHowBack" class="hw-back"><span aria-hidden="true">‹</span><span data-i18n="btn.back"></span></button>
      <h2 data-i18n="how.title"></h2>
      <nav class="hw-tabs" id="hwTabs"></nav>
    </header>
    <div class="hw-pages" id="hwPages"></div>
    <footer class="hw-foot">
      <button id="hwPrev" data-i18n="btn.prev"></button>
      <div class="hw-dots" id="hwDots"></div>
      <button id="hwNext" class="primary"></button>
    </footer>
  </section>

  <!-- 結算：大數字 -->
  <section id="result" class="screen hide">
    <div class="rcard">
      <h1 id="resTitle"></h1>
      <p id="resTag"></p>
      <div class="stats" id="resStats"></div>
      <div class="comp"><small data-i18n="res.comp"></small><div id="resComp"></div><div id="resLegend"></div></div>
      <div class="rbtns">
        <button id="btnAgain" class="primary" data-i18n="btn.again"></button>
        <button id="btnMenu" data-i18n="btn.menu"></button>
      </div>
    </div>
  </section>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
